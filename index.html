<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#075b32">
<meta name="description" content="যিকরা — আল্লাহর স্মরণে হৃদয় ভরে, নেক আমলে জীবন গড়ে।">
<title>যিকরা | ذِكْرَى</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#087b45 0,#063b25 62%,#022718 100%);color:#fff;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}
main{width:min(100%,560px);text-align:center;padding:40px 28px;border:1px solid #e4c36c70;border-radius:30px;background:linear-gradient(145deg,#08713d,#032d1b);box-shadow:0 18px 60px #00190f80}
.mark{width:84px;height:84px;margin:0 auto 18px;border-radius:24px;display:grid;place-items:center;background:#f3d77a;color:#07512e;font-size:2.5rem;font-weight:800}
h1{font-size:clamp(2rem,8vw,3.4rem);margin:0;color:#f3d77a}.arabic{font-size:1.8rem;margin:8px 0 22px;color:#ffe7a1}
p{line-height:1.9;color:#e8f3eb}.cta{display:inline-block;margin:16px 0 10px;padding:13px 26px;border-radius:999px;background:#f3d77a;color:#063b25;text-decoration:none;font-weight:800}
small{display:block;margin-top:14px;color:#b9d6c3;line-height:1.7}
</style>
</head>
<body><main><div class="mark" aria-hidden="true">ذ</div><h1>যিকরা</h1><div class="arabic" lang="ar" dir="rtl">ذِكْرَى</div><p>আল্লাহর স্মরণে হৃদয় ভরে, নেক আমলে জীবন গড়ে।</p><a class="cta" href="https://amolzikir.github.io/amar-amol-zikir/">যিকরা অ্যাপ খুলুন</a><small>কুরআন ও সুন্নাহর আলোকে স্মরণ, আমল, জিকির ও উপকারী কথার ক্ষুদ্র প্রয়াস।</small></main></body>
</html>
